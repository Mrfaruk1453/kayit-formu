<!DOCTYPE html>
<html lang="tr">
<head>
    <meta charset="UTF-8">
    <!-- Mobil cihazlar için responsive ayarı -->
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Giriş ve Kayıt Formu</title>
    <!-- Tailwind CSS Yüklemesi -->
    <script src="https://cdn.tailwindcss.com"></script>
    <!-- FontAwesome İkonları (Şifre göster/gizle için) -->
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    
    <style>
        @import url('https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700&display=swap');
        
        body {
            font-family: 'Inter', sans-serif;
            background: linear-gradient(135deg, #f0f9ff 0%, #cbebff 50%, #a1c4fd 100%);
            min-height: 100vh;
            display: flex;
            align-items: center;
            justify-content: center;
            margin: 0;
            padding: 1rem;
        }

        /* Yüzen etiket (Floating Label) stilleri Tailwind sınıflarıyla yönetildi 
           fakat otomatik tamamlama (autocomplete) background rengini düzeltmek için özel CSS */
        input:-webkit-autofill {
            -webkit-box-shadow: 0 0 0 50px white inset;
        }
        
        /* Form kapsayıcısının yüksekliğini animasyonlu değiştirmek için */
        .form-container-wrapper {
            transition: height 0.4s ease;
        }
    </style>
</head>
<body class="antialiased text-gray-800">

    <main class="w-full max-w-md bg-white rounded-2xl shadow-2xl overflow-hidden relative border border-white/40 backdrop-blur-sm">
        <div class="p-8">
            
            <!-- Başlık Alanı -->
            <div class="text-center mb-8">
                <h1 class="text-2xl font-bold text-gray-800 tracking-tight">Hoş Geldiniz</h1>
                <p class="text-sm text-gray-500 mt-2">Devam etmek için lütfen giriş yapın veya kayıt olun.</p>
            </div>

            <!-- Tab (Geçiş) Butonları -->
            <div class="flex relative bg-gray-100/80 p-1 rounded-xl mb-8 shadow-inner">
                <!-- Kayan Arka Plan (Slider) -->
                <div id="tab-slider" class="absolute left-1 top-1 w-[calc(50%-0.25rem)] h-[calc(100%-0.5rem)] bg-white rounded-lg shadow-sm transition-all duration-300 ease-in-out"></div>
                
                <button type="button" id="btn-login" class="flex-1 relative z-10 py-2.5 text-sm font-semibold transition-colors duration-300 text-indigo-600 focus:outline-none" tabindex="1">
                    Giriş Yap
                </button>
                <button type="button" id="btn-register" class="flex-1 relative z-10 py-2.5 text-sm font-semibold transition-colors duration-300 text-gray-500 focus:outline-none" tabindex="2">
                    Kayıt Ol
                </button>
            </div>

            <!-- Form Alanları Kapsayıcısı (Taşan kısımları gizler, yatayda kaydırır) -->
            <div class="relative overflow-hidden w-full form-container-wrapper" id="form-wrapper">
                <div id="forms-slider" class="flex transition-transform duration-500 ease-in-out w-[200%]">
                    
                    <!-- GİRİŞ FORMU -->
                    <div class="w-1/2 px-1">
                        <form id="login-form" class="flex flex-col gap-5" onsubmit="handleLogin(event)">
                            
                            <!-- E-posta Input -->
                            <div class="relative">
                                <input type="email" id="login-email" name="email" tabindex="3"
                                    class="peer block w-full rounded-xl border border-gray-300 bg-transparent px-4 pb-2.5 pt-5 text-sm text-gray-900 focus:border-indigo-600 focus:ring-2 focus:ring-indigo-100 focus:outline-none transition-all" 
                                    placeholder=" " required />
                                <label for="login-email" class="absolute top-3 left-4 z-10 origin-[0] -translate-y-3.5 scale-75 transform text-sm text-gray-500 duration-200 peer-placeholder-shown:translate-y-0 peer-placeholder-shown:scale-100 peer-focus:-translate-y-3.5 peer-focus:scale-75 peer-focus:text-indigo-600 bg-white px-1 cursor-text pointer-events-none">E-posta Adresi</label>
                            </div>

                            <!-- Şifre Input -->
                            <div class="relative">
                                <input type="password" id="login-password" name="password" tabindex="4"
                                    class="peer block w-full rounded-xl border border-gray-300 bg-transparent px-4 pb-2.5 pt-5 text-sm text-gray-900 focus:border-indigo-600 focus:ring-2 focus:ring-indigo-100 focus:outline-none transition-all pr-12" 
                                    placeholder=" " required />
                                <label for="login-password" class="absolute top-3 left-4 z-10 origin-[0] -translate-y-3.5 scale-75 transform text-sm text-gray-500 duration-200 peer-placeholder-shown:translate-y-0 peer-placeholder-shown:scale-100 peer-focus:-translate-y-3.5 peer-focus:scale-75 peer-focus:text-indigo-600 bg-white px-1 cursor-text pointer-events-none">Şifre</label>
                                <!-- Şifre Göster/Gizle Butonu -->
                                <button type="button" tabindex="-1" class="absolute right-3 top-1/2 -translate-y-1/2 text-gray-400 hover:text-indigo-600 focus:outline-none transition-colors p-2" onclick="togglePassword('login-password', this)">
                                    <i class="fa-regular fa-eye"></i>
                                </button>
                            </div>

                            <div class="flex items-center justify-between mt-1">
                                <label class="flex items-center gap-2 cursor-pointer">
                                    <input type="checkbox" tabindex="5" class="rounded border-gray-300 text-indigo-600 focus:ring-indigo-600 w-4 h-4 cursor-pointer">
                                    <span class="text-sm text-gray-600">Beni Hatırla</span>
                                </label>
                                <a href="#" class="text-sm font-medium text-indigo-600 hover:text-indigo-500" tabindex="6">Şifremi Unuttum?</a>
                            </div>

                            <!-- Geri Bildirim Alanı -->
                            <div id="login-feedback" class="text-sm hidden rounded-lg p-3"></div>

                            <button type="submit" tabindex="7" class="w-full bg-indigo-600 text-white rounded-xl py-3.5 font-semibold shadow-lg shadow-indigo-200 hover:bg-indigo-700 hover:shadow-indigo-300 focus:ring-4 focus:ring-indigo-100 transition-all active:scale-[0.98]">
                                Giriş Yap
                            </button>
                        </form>
                    </div>

                    <!-- KAYIT FORMU -->
                    <div class="w-1/2 px-1">
                        <form id="register-form" class="flex flex-col gap-4" onsubmit="handleRegister(event)">
                            
                            <!-- Ad Soyad Input -->
                            <div class="relative">
                                <input type="text" id="reg-name" name="name" tabindex="8"
                                    class="peer block w-full rounded-xl border border-gray-300 bg-transparent px-4 pb-2.5 pt-5 text-sm text-gray-900 focus:border-indigo-600 focus:ring-2 focus:ring-indigo-100 focus:outline-none transition-all disabled-on-start" 
                                    placeholder=" " required minlength="3" disabled />
                                <label for="reg-name" class="absolute top-3 left-4 z-10 origin-[0] -translate-y-3.5 scale-75 transform text-sm text-gray-500 duration-200 peer-placeholder-shown:translate-y-0 peer-placeholder-shown:scale-100 peer-focus:-translate-y-3.5 peer-focus:scale-75 peer-focus:text-indigo-600 bg-white px-1 cursor-text pointer-events-none">Ad Soyad</label>
                            </div>

                            <!-- E-posta Input -->
                            <div class="relative">
                                <input type="email" id="reg-email" name="email" tabindex="9"
                                    class="peer block w-full rounded-xl border border-gray-300 bg-transparent px-4 pb-2.5 pt-5 text-sm text-gray-900 focus:border-indigo-600 focus:ring-2 focus:ring-indigo-100 focus:outline-none transition-all disabled-on-start" 
                                    placeholder=" " required disabled />
                                <label for="reg-email" class="absolute top-3 left-4 z-10 origin-[0] -translate-y-3.5 scale-75 transform text-sm text-gray-500 duration-200 peer-placeholder-shown:translate-y-0 peer-placeholder-shown:scale-100 peer-focus:-translate-y-3.5 peer-focus:scale-75 peer-focus:text-indigo-600 bg-white px-1 cursor-text pointer-events-none">E-posta Adresi</label>
                            </div>

                            <!-- Telefon Input -->
                            <div class="relative">
                                <input type="tel" id="reg-phone" name="phone" tabindex="10"
                                    class="peer block w-full rounded-xl border border-gray-300 bg-transparent px-4 pb-2.5 pt-5 text-sm text-gray-900 focus:border-indigo-600 focus:ring-2 focus:ring-indigo-100 focus:outline-none transition-all disabled-on-start" 
                                    placeholder=" " required pattern="[0-9\s\-\+\(\)]{10,15}" title="Geçerli bir telefon numarası giriniz" disabled />
                                <label for="reg-phone" class="absolute top-3 left-4 z-10 origin-[0] -translate-y-3.5 scale-75 transform text-sm text-gray-500 duration-200 peer-placeholder-shown:translate-y-0 peer-placeholder-shown:scale-100 peer-focus:-translate-y-3.5 peer-focus:scale-75 peer-focus:text-indigo-600 bg-white px-1 cursor-text pointer-events-none">Telefon Numarası</label>
                            </div>

                            <!-- Şifre Input -->
                            <div class="relative">
                                <input type="password" id="reg-password" name="password" tabindex="11"
                                    class="peer block w-full rounded-xl border border-gray-300 bg-transparent px-4 pb-2.5 pt-5 text-sm text-gray-900 focus:border-indigo-600 focus:ring-2 focus:ring-indigo-100 focus:outline-none transition-all pr-12 disabled-on-start" 
                                    placeholder=" " required minlength="6" disabled />
                                <label for="reg-password" class="absolute top-3 left-4 z-10 origin-[0] -translate-y-3.5 scale-75 transform text-sm text-gray-500 duration-200 peer-placeholder-shown:translate-y-0 peer-placeholder-shown:scale-100 peer-focus:-translate-y-3.5 peer-focus:scale-75 peer-focus:text-indigo-600 bg-white px-1 cursor-text pointer-events-none">Şifre (En az 6 karakter)</label>
                                <button type="button" tabindex="-1" class="absolute right-3 top-1/2 -translate-y-1/2 text-gray-400 hover:text-indigo-600 focus:outline-none transition-colors p-2 disabled-on-start" onclick="togglePassword('reg-password', this)" disabled>
                                    <i class="fa-regular fa-eye"></i>
                                </button>
                            </div>

                            <!-- Geri Bildirim Alanı -->
                            <div id="register-feedback" class="text-sm hidden rounded-lg p-3"></div>

                            <button type="submit" tabindex="12" id="reg-submit" class="w-full mt-2 bg-gray-800 text-white rounded-xl py-3.5 font-semibold shadow-lg shadow-gray-200 hover:bg-gray-900 hover:shadow-gray-300 focus:ring-4 focus:ring-gray-200 transition-all active:scale-[0.98] disabled-on-start" disabled>
                                Kayıt Ol
                            </button>
                        </form>
                    </div>
                </div>
            </div>

        </div>
    </main>

    <script>
        // DOM Elementlerini Seçimi
        const btnLogin = document.getElementById('btn-login');
        const btnRegister = document.getElementById('btn-register');
        const tabSlider = document.getElementById('tab-slider');
        const formsSlider = document.getElementById('forms-slider');
        const formWrapper = document.getElementById('form-wrapper');
        
        const loginForm = document.getElementById('login-form');
        const registerForm = document.getElementById('register-form');
        const regInputs = document.querySelectorAll('.disabled-on-start');
        const loginInputs = loginForm.querySelectorAll('input, button');

        // Dinamik Yükseklik Ayarlama Fonksiyonu
        function adjustWrapperHeight() {
            // Aktif olan formun yüksekliğini hesaplayıp kapsayıcıya verir
            const activeForm = formsSlider.style.transform === 'translateX(-50%)' ? registerForm : loginForm;
            formWrapper.style.height = activeForm.offsetHeight + 'px';
        }

        // Sayfa yüklendiğinde yüksekliği ayarla
        window.addEventListener('DOMContentLoaded', () => {
            adjustWrapperHeight();
            // Ekran yeniden boyutlandığında yüksekliği güncelle
            window.addEventListener('resize', adjustWrapperHeight);
        });

        // --- SEKME (TAB) GEÇİŞ İŞLEMLERİ ---
        btnLogin.addEventListener('click', () => {
            // Slider pozisyonu
            tabSlider.style.transform = 'translateX(0)';
            formsSlider.style.transform = 'translateX(0)';
            
            // Renk Güncellemeleri
            btnLogin.classList.add('text-indigo-600');
            btnLogin.classList.remove('text-gray-500');
            btnRegister.classList.add('text-gray-500');
            btnRegister.classList.remove('text-indigo-600');

            // Kayıt formundaki elemanları pasifleştir (Tab ile atlanmaması için)
            regInputs.forEach(el => el.disabled = true);
            // Giriş formundaki elemanları aktifleştir
            loginInputs.forEach(el => el.disabled = false);

            adjustWrapperHeight();
        });

        btnRegister.addEventListener('click', () => {
            // Slider pozisyonu
            tabSlider.style.transform = 'translateX(calc(100% + 0.25rem))';
            formsSlider.style.transform = 'translateX(-50%)';
            
            // Renk Güncellemeleri
            btnRegister.classList.add('text-indigo-600');
            btnRegister.classList.remove('text-gray-500');
            btnLogin.classList.add('text-gray-500');
            btnLogin.classList.remove('text-indigo-600');

            // Kayıt formundaki elemanları aktifleştir
            regInputs.forEach(el => el.disabled = false);
            // Giriş formundaki elemanları pasifleştir
            loginInputs.forEach(el => el.disabled = true);

            adjustWrapperHeight();
        });

        // --- ŞİFRE GİZLE/GÖSTER İŞLEMİ ---
        function togglePassword(inputId, button) {
            const input = document.getElementById(inputId);
            const icon = button.querySelector('i');
            
            if (input.type === 'password') {
                input.type = 'text';
                icon.classList.remove('fa-eye');
                icon.classList.add('fa-eye-slash');
                button.classList.add('text-indigo-600');
            } else {
                input.type = 'password';
                icon.classList.remove('fa-eye-slash');
                icon.classList.add('fa-eye');
                button.classList.remove('text-indigo-600');
            }
        }

        // --- FORM DOĞRULAMA VE GÖNDERME (FRONTEND MOCK) ---
        
        function showFeedback(elementId, message, type) {
            const el = document.getElementById(elementId);
            el.innerHTML = message;
            el.classList.remove('hidden', 'bg-red-50', 'text-red-600', 'bg-green-50', 'text-green-600');
            
            if (type === 'success') {
                el.classList.add('block', 'bg-green-50', 'text-green-700', 'border', 'border-green-200');
            } else {
                el.classList.add('block', 'bg-red-50', 'text-red-700', 'border', 'border-red-200');
            }
            adjustWrapperHeight();
        }

        function handleLogin(e) {
            e.preventDefault(); // Sayfa yenilenmesini engelle
            const btn = e.target.querySelector('button[type="submit"]');
            
            // Yükleniyor animasyonu
            const originalText = btn.innerHTML;
            btn.innerHTML = '<i class="fa-solid fa-circle-notch fa-spin"></i> Giriş Yapılıyor...';
            btn.disabled = true;

            // Simüle edilmiş sunucu isteği
            setTimeout(() => {
                showFeedback('login-feedback', '<i class="fa-solid fa-circle-check mr-2"></i> Başarıyla giriş yapıldı. Yönlendiriliyorsunuz...', 'success');
                btn.innerHTML = originalText;
                btn.disabled = false;
                e.target.reset(); // Formu temizle
            }, 1500);
        }

        function handleRegister(e) {
            e.preventDefault(); // Sayfa yenilenmesini engelle
            const btn = document.getElementById('reg-submit');
            
            // Telefon numarası temizleme formatı
            const phoneVal = document.getElementById('reg-phone').value;
            const strippedPhone = phoneVal.replace(/\D/g,'');
            
            if(strippedPhone.length < 10) {
                showFeedback('register-feedback', '<i class="fa-solid fa-circle-exclamation mr-2"></i> Lütfen geçerli bir telefon numarası girin.', 'error');
                return;
            }

            // Yükleniyor animasyonu
            const originalText = btn.innerHTML;
            btn.innerHTML = '<i class="fa-solid fa-circle-notch fa-spin"></i> Kayıt Olunuyor...';
            btn.disabled = true;

            // Simüle edilmiş sunucu isteği
            setTimeout(() => {
                showFeedback('register-feedback', '<i class="fa-solid fa-circle-check mr-2"></i> Hesabınız başarıyla oluşturuldu! Lütfen giriş yapın.', 'success');
                btn.innerHTML = originalText;
                btn.disabled = false;
                e.target.reset(); // Formu temizle
                
                // Başarı sonrası Giriş sekmesine otomatik dön
                setTimeout(() => {
                    btnLogin.click();
                    document.getElementById('register-feedback').classList.add('hidden');
                }, 2500);
                
            }, 1500);
        }
    </script>
</body>
</html>
